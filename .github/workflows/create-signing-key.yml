name: Create signing key

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CREATE to confirm'
        required: true
      replace_existing:
        description: 'Leave empty. Type REPLACE only if a key already exists and you want a new one (old installs will need uninstalling)'
        required: false
        default: ''

jobs:
  create-key:
    runs-on: ubuntu-latest

    steps:
      - name: Confirm
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "CREATE" ]; then
            echo "Type CREATE in the confirm box."
            exit 1
          fi

      - name: Check the token secret exists
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Add a repository secret called GH_PAT first (a token with Secrets read and write access)."
            exit 1
          fi

      - name: Refuse to overwrite an existing key
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPLACE: ${{ inputs.replace_existing }}
        run: |
          if gh secret list --repo "$GITHUB_REPOSITORY" | grep -q '^KEYSTORE_BASE64'; then
            if [ "$REPLACE" != "REPLACE" ]; then
              echo "A signing key already exists. Replacing it would stop updates from installing over the current app."
              exit 1
            fi
          fi

      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 24)
          echo "::add-mask::$PASS"
          keytool -genkeypair -keystore yomichi.jks -storetype PKCS12 -alias yomichi \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Yomichi, O=McFoster1"
          echo "STORE_PASS=$PASS" >> "$GITHUB_ENV"

      - name: Save the key as repository secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          base64 -w0 yomichi.jks > keystore.b64
          gh secret set KEYSTORE_BASE64 --repo "$GITHUB_REPOSITORY" < keystore.b64
          gh secret set KEYSTORE_PASSWORD --repo "$GITHUB_REPOSITORY" --body "$STORE_PASS"
          gh secret set KEY_PASSWORD --repo "$GITHUB_REPOSITORY" --body "$STORE_PASS"
          gh secret set KEY_ALIAS --repo "$GITHUB_REPOSITORY" --body "yomichi"

      - name: Make an encrypted backup (only if KEY_BACKUP_PASSWORD secret exists)
        env:
          BACKUP_PASS: ${{ secrets.KEY_BACKUP_PASSWORD }}
        run: |
          if [ -n "$BACKUP_PASS" ]; then
            printf 'alias: yomichi\npassword: %s\n' "$STORE_PASS" > key-info.txt
            tar czf - yomichi.jks key-info.txt \
              | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:BACKUP_PASS -out yomichi-key-backup.enc
            echo "HAS_BACKUP=true" >> "$GITHUB_ENV"
          fi

      - name: Upload the encrypted backup
        if: env.HAS_BACKUP == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: yomichi-key-backup
          path: yomichi-key-backup.enc
          retention-days: 7
