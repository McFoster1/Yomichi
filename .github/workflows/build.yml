name: Build and release Yomichi

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number, for example 1.3.1'
        required: true
        default: '1.3.0'
      notes:
        description: 'Release notes (optional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check version number
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "Version must look like 1.3.1 (numbers separated by dots)."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode keystore (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/yomichi.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/yomichi.jks" >> "$GITHUB_ENV"
          fi

      - name: Build signed release APK
        if: env.KEYSTORE_PATH != ''
        env:
          VERSION: ${{ inputs.version }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PappVersionName="$VERSION" \
            -PappVersionCode=$((GITHUB_RUN_NUMBER + 100))
          cp app/build/outputs/apk/release/*.apk "Yomichi-v$VERSION.apk"

      - name: Build debug-signed APK (no keystore configured yet)
        if: env.KEYSTORE_PATH == ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ./gradlew assembleDebug \
            -PappVersionName="$VERSION" \
            -PappVersionCode=$((GITHUB_RUN_NUMBER + 100))
          cp app/build/outputs/apk/debug/*.apk "Yomichi-v$VERSION.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
          SIGNED: ${{ env.KEYSTORE_PATH != '' }}
        run: |
          BODY="$NOTES"
          if [ "$SIGNED" != "true" ]; then
            BODY="$BODY"$'\n\n'"Built with a temporary debug key. Uninstall the previous version before installing this one."
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "Yomichi-v$VERSION.apk" --clobber
          else
            gh release create "v$VERSION" "Yomichi-v$VERSION.apk" \
              --title "Yomichi v$VERSION" \
              --notes "$BODY" \
              --target "$GITHUB_SHA"
          fi
